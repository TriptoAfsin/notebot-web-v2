<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- was type="image/svg+xml" pointing at a 512px 50 KiB PNG: the wrong MIME
         type, and 50 KiB to draw a 16px tab icon -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/pwa-64x64.png" sizes="64x64" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) resolves in the installed
         PWA, where the app draws under the system bars -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f7f8fb"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#111318"
    />
    <title>NoteBot Web</title>
    <!-- The two faces on nearly every screen: headings and body. Discovered here
         rather than midway through parsing the CSS that references them, so they
         download in parallel with it. `crossorigin` is required even same-origin
         — fonts are fetched in CORS mode, and without it the preload is ignored
         and fetched a second time. -->
    <link
      rel="preload"
      href="/fonts/satoshi-700-all.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NoteBOT Web" />
    <meta
      property="og:description"
      content="Connecting People Through Notes ❤"
    />
    <meta
      property="og:image"
      content="https://i.postimg.cc/Pfw5D2tf/meta-og-thumbnails.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="NoteBOT Web" />
    <meta
      property="twitter:description"
      content="Connecting People Through
    Notes ❤"
    />
    <meta
      property="twitter:image"
      content="https://i.postimg.cc/Pfw5D2tf/meta-og-thumbnails.png"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "ouh1wr9s6y");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
