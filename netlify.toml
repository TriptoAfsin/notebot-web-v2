[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned so the build can't drift when Netlify moves its image default.
  # React 19 / Vite 5 / TypeScript 5.9 need a current LTS. Mirrors .nvmrc.
  NODE_VERSION = "22"
  # NODE_ENV is deliberately left unset. Setting it to "production" makes Netlify
  # skip devDependencies — and typescript, vite, tailwindcss, postcss and
  # autoprefixer all live there, so the build would die at `tsc`.

# ---------------------------------------------------------------------------
# Old domain · service worker kill switch. MUST stay above the 301 below.
#
# Installs on notebot.netlify.app carry a Workbox worker that answers navigations
# from precache, so they'd never reach the network to see the redirect — and a
# worker update whose script fetch lands on a redirect is specified to fail, which
# would pin those installs to the old build permanently.
#
# So `/sw.js` on the old host is rewritten (status 200 — same URL, no redirect) to
# a worker that clears the caches, unregisters itself and reloads its windows.
# Those reloads hit the network and follow the 301. See public/sw-kill.js.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://notebot.netlify.app/sw.js"
  to = "/sw-kill.js"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# Old domain → new domain.
#
# The .netlify.app subdomain keeps serving the site after a custom domain is
# attached, so the move to butexnotebot.com has to be forced here.
#
#  - `force = true` is required: without it the rule is only consulted when no
#    real file matches, so `/` and every hashed asset would keep answering on
#    the old host.
#  - This block must stay ABOVE the SPA fallback. Netlify stops at the first
#    match, and a `/*` catch-all above would swallow it.
#  - The host is matched exactly, so deploy previews and branch deploys
#    (deploy-preview-N--<site>.netlify.app) are unaffected.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://notebot.netlify.app/*"
  to = "https://butexnotebot.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# SPA fallback. Real files are served first, so this only catches client routes.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Caching
#
# Hashed build output is safe to cache forever; the HTML entry and the service
# worker must not be. Without this the SW response gets cached and visitors stay
# pinned to a stale worker that keeps serving an old build after a deploy — the
# classic "my users are stuck on last week's version" PWA failure.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Baseline security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
